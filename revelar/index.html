<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#11152b">
  <title>Fotos de la clase</title>
  <link rel="stylesheet" href="revelar.css?v=202610310600">
  <link rel="manifest" href="alumno.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="iconos/alumno-192.png">
  <link rel="apple-touch-icon" href="iconos/alumno-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reveal Clase">
  <script type="module" src="js/pwa.js?v=202610310600"></script>
</head>
<body class="sala">
  <!-- Sin barra superior: solo el contenido. Si se pierde la conexión, aparece un aviso discreto. -->
  <div id="sinRed" class="sin-red" hidden data-i18n="reconnecting">Sin conexión… reconectando</div>
  <div id="aviso" class="aviso" hidden></div>

  <main class="lista" id="lista" aria-live="polite">
    <!-- Espera: puntitos de colores que brillan y flotan despacio -->
    <div class="vacio espera" id="vacio" aria-label="Esperando" data-i18n-aria="waiting">
      <canvas id="puntos" aria-hidden="true"></canvas>
    </div>
  </main>

  <div class="visor" id="visor" hidden><img id="visorImg" alt=""></div>

  <!-- Elegir maestro: los códigos guardados en este teléfono -->
  <button class="btn-maestros" id="btnMaestros" type="button" aria-label="Mis maestros" data-i18n-aria="myTeachers">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M15.5 5.2a3 3 0 0 1 0 5.6M17.5 14.3c2 .6 3.5 2.5 3.5 5.2"/></svg>
  </button>
  <dialog id="dlgMaestros" class="dlg-maestros">
    <h2 data-i18n="myTeachers">Mis maestros</h2>
    <p class="ayuda-m" data-i18n="followHint">Toca un maestro para seguir su clase.</p>
    <ul class="mis-maestros" id="misMaestros"></ul>
    <h3 id="tituloForm" data-i18n="addTeacher">Agregar maestro</h3>
    <div class="fila-maestro">
    <label class="campo campo-codigo"><span data-i18n="codeShort">Código</span>
      <input id="mCodigo" maxlength="8" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" placeholder="k7m2p">
    </label>
    <label class="campo campo-nombre"><span data-i18n="nameShort">Nombre</span>
      <input id="mNombre" maxlength="40" autocomplete="off" placeholder="Pastor Juan" data-i18n-ph="namePhStudent">
    </label>
    </div>
    <p class="error-m" id="mError" hidden></p>
    <div class="acciones">
      <button class="btn" type="button" id="mCerrar" data-i18n="close">Cerrar</button>
      <button class="btn primario" type="button" id="mGuardar" data-i18n="saveFollow">Guardar y seguir</button>
    </div>
  </dialog>

  <script type="module">
    import { CONFIG } from "./config.js?v=202610310600";
    import { crearStore, crearCatalogo, limpiarCodigo, sesionActual, ordenar, esTemporal, idReal, esFoco, FOCO } from "./js/store.js?v=202610310600";
    import "./js/presion.js?v=202610310600";
    import { confirmarQuitar } from "./js/confirmar.js?v=202610310600";
    import { idioma, t, traducir } from "./js/i18n.js?v=202610310600";
    import { textoAHtml, esEscritura, esSubida } from "./js/escritura.js?v=202610310600";
    // fotos.js se pide siempre fresco: así un cambio de fotos se ve al recargar,
    // sin esperar los 10 minutos de caché de GitHub Pages.
    const { FOTOS } = await import("./fotos.js?v=" + Date.now());

    const $ = (id) => document.getElementById(id);
    const porId = new Map(FOTOS.map((f) => [f.id, f]));
    const tarjetas = new Map();          // id → <figure>
    const bajas = new Map();             // id → función para dejar de escuchar una escritura
    let primeraCarga = true;
    let ultimoFoco = null;

    idioma();             // el del teléfono, o el elegido en este teléfono
    traducir();
    document.title = t("classPhotos");

    // Un solo enlace para siempre: sin ?s= se sigue la lección que el presentador
    // puso en vivo. Si cambia de lección, la página se recarga sola.
    // ?p=<código> sigue la lección en vivo de ese maestro; sin código, la del presentador original.
    // ---------- Mis maestros (guardados en este teléfono) ----------
    const param = new URLSearchParams(location.search);
    const MIS = "revelar:maestros";
    const leerMis = () => { try { return JSON.parse(localStorage.getItem(MIS)) || []; } catch { return []; } };
    const guardarMis = (l) => { try { localStorage.setItem(MIS, JSON.stringify(l)); } catch {} };
    // "" = la clase original (enlace sin código); null = sesión fija (?s=)
    const codigoActual = param.has("s") ? null : (limpiarCodigo(param.get("p")) || "");
    if (codigoActual !== null && !param.has("unirse")) {   // ?unirse solo abre la lista
      const l = leerMis();
      const m = l.find((x) => x.codigo === codigoActual);
      if (m) m.usado = Date.now(); else l.push({ codigo: codigoActual, nombre: "", usado: Date.now() });
      guardarMis(l);
    }
    const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    const escapar = (x) => String(x ?? "").replace(/[&<>"']/g, (c) => ESC[c]);
    const nombreDe = (m) => m.nombre || (m.codigo ? t("teacherWith", { c: m.codigo }) : t("mainClass"));
    const irA = (codigo) => { location.href = codigo ? "./?p=" + encodeURIComponent(codigo) : "./"; };
    let editando = null;
    function pintarMaestros() {
      const l = leerMis().sort((a, b) => (b.usado || 0) - (a.usado || 0));
      $("misMaestros").innerHTML = l.map((m) => `
        <li class="${m.codigo === codigoActual ? "actual" : ""}" data-c="${escapar(m.codigo)}">
          <button type="button" class="m-ir">
            <b>${escapar(nombreDe(m))}</b>
            <small>${m.codigo ? escapar(m.codigo) : "—"}${m.codigo === codigoActual ? " · " + escapar(t("now")) : ""}</small>
          </button>
          <button type="button" class="m-ed" aria-label="${escapar(t("edit"))}">✎</button>
          <button type="button" class="m-x" aria-label="${escapar(t("removeTeacher"))}">✕</button>
        </li>`).join("");
      $("misMaestros").hidden = !l.length;
      $("tituloForm").textContent = editando !== null ? t("editTeacher") : t("addTeacher");
    }
    $("misMaestros").addEventListener("click", async (e) => {
      const li = e.target.closest("li");
      if (!li) return;
      const codigo = li.dataset.c;
      if (e.target.closest(".m-x")) {
        const m = leerMis().find((x) => x.codigo === codigo);
        if (!(await confirmarQuitar(m ? nombreDe(m) : codigo, t))) return;
        guardarMis(leerMis().filter((m) => m.codigo !== codigo));
        pintarMaestros();
      } else if (e.target.closest(".m-ed")) {
        const m = leerMis().find((x) => x.codigo === codigo);
        editando = codigo;
        $("mCodigo").value = codigo; $("mNombre").value = m?.nombre || "";
        pintarMaestros(); $("mNombre").focus();
      } else if (codigo === codigoActual) {
        $("dlgMaestros").close();
      } else irA(codigo);
    });
    function abrirMaestros() {
      editando = null; $("mCodigo").value = ""; $("mNombre").value = ""; $("mError").hidden = true;
      pintarMaestros();
      $("dlgMaestros").showModal();
    }
    $("btnMaestros").addEventListener("click", abrirMaestros);
    $("mCerrar").addEventListener("click", () => $("dlgMaestros").close());
    $("mGuardar").addEventListener("click", () => {
      const codigo = limpiarCodigo($("mCodigo").value);
      const nombre = $("mNombre").value.trim().slice(0, 40);
      if (codigo.length < 4 && !(editando === "" && !codigo)) {
        $("mError").textContent = t("codeTooShort"); $("mError").hidden = false; $("mCodigo").focus(); return;
      }
      let l = leerMis();
      if (editando !== null && editando !== codigo) l = l.filter((m) => m.codigo !== editando);
      const m = l.find((x) => x.codigo === codigo);
      if (m) { m.nombre = nombre; m.usado = Date.now(); } else l.push({ codigo, nombre, usado: Date.now() });
      guardarMis(l);
      if (codigo === codigoActual) { editando = null; $("mCodigo").value = ""; $("mNombre").value = ""; pintarMaestros(); return; }
      irA(codigo);
    });
    [$("mCodigo"), $("mNombre")].forEach((el) => el.addEventListener("keydown", (e) => { if (e.key === "Enter") $("mGuardar").click(); }));
    if (param.has("unirse")) abrirMaestros();

    let sesion = sesionActual();
    if (!param.has("s")) {
      const codigo = codigoActual || null;
      try {
        const cat = await crearCatalogo();
        const actual = await cat.leerActual(codigo);
        if (actual) sesion = actual;
        else if (codigo) sesion = "sin-leccion-" + codigo;   // aún no hay lección en vivo: espera
        cat.onActual(codigo, (a) => { if (a && a !== sesion) location.reload(); });
      } catch {}
    }
    const store = await crearStore(sesion);
    if (store.modo === "demo") {
      $("aviso").hidden = false;
      $("aviso").textContent = t("demoParticipant");
    }

    let yaConecto = false;
    store.onConexion((ok) => {
      if (ok) yaConecto = true;
      $("sinRed").hidden = ok || !yaConecto; // solo avisa si se cayó después de conectar
    });
    store.registrarPresencia();
    store.onReveladas(pintar, () => {
      $("aviso").hidden = false;
      $("aviso").textContent = t("participantReadFail");
    });

    // Escritura: tarjeta de texto que se actualiza sola si el presentador la edita
    // (por ejemplo, cuando resalta palabras en plena clase).
    function crearTarjetaEscritura(id) {
      const fig = document.createElement("figure");
      fig.className = "foto escritura entrando";
      fig.dataset.id = id;
      fig.innerHTML = `<div class="verso"><p></p><cite></cite></div><figcaption><span class="orden"></span></figcaption>`;
      bajas.set(id, store.onEscritura(id, (e) => {
        if (!e) return;
        fig.querySelector(".verso p").innerHTML = textoAHtml(e.texto, e.todoRojo);
        fig.querySelector(".verso cite").textContent = e.cita || "";
      }));
      return fig;
    }

    function crearTarjeta(foto) {
      const fig = document.createElement("figure");
      fig.className = "foto entrando";
      fig.dataset.id = foto.id;
      const img = document.createElement("img");
      img.src = foto.src;
      img.alt = foto.titulo || "";
      img.decoding = "async";
      const cap = document.createElement("figcaption");
      const orden = document.createElement("span");
      orden.className = "orden";
      cap.append(orden);
      if (foto.titulo) cap.append(document.createTextNode(foto.titulo));
      fig.append(img, cap);
      fig.addEventListener("click", () => abrirVisor({ src: img.src, titulo: foto.titulo }));
      return fig;
    }

    // Foto subida desde el presentador con "+": la imagen viene de Firebase.
    // Fotos: la del repo (si existe) o la de Firebase. Si el presentador cambia
    // la foto, Firebase la reemplaza al momento.
    function crearTarjetaFoto(id) {
      const original = porId.get(id);
      const fig = crearTarjeta({ id, src: original?.src || "" });
      const img = fig.querySelector("img");
      if (!original) img.removeAttribute("src");
      bajas.set(id, store.onSubida(id, (f) => {
        const nuevo = f?.src || original?.src;
        if (nuevo && img.getAttribute("src") !== nuevo) img.src = nuevo;
      }));
      return fig;
    }

    function pintar(reveladas) {
      // Lo revelado en orden lleva número; un desvío (tocado fuera de orden) no.
      const ids = [], temporal = new Set();
      ordenar(reveladas).forEach((k) => {
        const id = idReal(k);
        if (!(porId.has(id) || esEscritura(id) || esSubida(id)) || ids.includes(id)) return;
        ids.push(id);
        if (esTemporal(k)) temporal.add(id);
      });
      const visibles = new Set(ids);
      const lista = $("lista");

      // Quitar las que el presentador ocultó.
      let huboBajas = false;
      for (const [id, fig] of tarjetas) {
        if (visibles.has(id)) continue;
        huboBajas = true;
        tarjetas.delete(id);
        const baja = bajas.get(id);
        if (baja) { try { baja(); } catch {} bajas.delete(id); }
        fig.style.maxHeight = fig.offsetHeight + "px";
        requestAnimationFrame(() => {
          fig.classList.add("saliendo");
          fig.style.maxHeight = "0px";
          fig.style.marginBottom = "-6px";
        });
        setTimeout(() => fig.remove(), 480);
      }

      // Agregar / ordenar las visibles.
      let nueva = null, n = 0;
      ids.forEach((id) => {
        let fig = tarjetas.get(id);
        if (!fig) {
          fig = esEscritura(id) ? crearTarjetaEscritura(id) : crearTarjetaFoto(id);
          tarjetas.set(id, fig);
          nueva = fig;
          requestAnimationFrame(() => requestAnimationFrame(() => fig.classList.remove("entrando")));
        }
        fig.querySelector(".orden").textContent = temporal.has(id) ? "" : String(++n).padStart(2, "0");
        lista.append(fig); // append mueve el nodo: deja la lista en orden
      });

      $("vacio").hidden = ids.length > 0;

      // El presentador tocó una lámina que ya pasó: regresar a ella.
      const foco = Object.keys(reveladas || {}).filter(esFoco)
        .sort((a, b) => reveladas[a] - reveladas[b]).pop();
      const marcaFoco = foco ? foco + ":" + reveladas[foco] : null;
      if (marcaFoco && marcaFoco !== ultimoFoco) {
        ultimoFoco = marcaFoco;
        const fig = tarjetas.get(foco.slice(FOCO.length));
        if (fig) {
          setTimeout(() => fig.scrollIntoView({ behavior: primeraCarga ? "auto" : "smooth", block: "start" }), 80);
          primeraCarga = false;
          return;
        }
      }
      // Terminó el repaso (el presentador tocó Siguiente): volver a la última.
      if (!marcaFoco && ultimoFoco && !nueva && ids.length) {
        const ultimaFig = tarjetas.get(ids[ids.length - 1]);
        setTimeout(() => ultimaFig?.scrollIntoView({ behavior: "smooth", block: "start" }), 80);
      }
      if (!marcaFoco) ultimoFoco = null;

      // El presentador retrocedió (↶): quedarse en la que ahora es la última.
      if (!nueva && huboBajas && !primeraCarga && ids.length) {
        const ultimaFig = tarjetas.get(ids[ids.length - 1]);
        setTimeout(() => ultimaFig?.scrollIntoView({ behavior: "smooth", block: "start" }), 500);
      }

      if (nueva && !primeraCarga) {
        document.querySelectorAll(".foto.nueva").forEach((f) => f.classList.remove("nueva"));
        nueva.classList.add("nueva");
        setTimeout(() => nueva.classList.remove("nueva"), 2600);
        setTimeout(() => nueva.scrollIntoView({ behavior: "smooth", block: "start" }), 80);
        if (navigator.vibrate) navigator.vibrate(30);
      }
      primeraCarga = false;
    }

    function abrirVisor(foto) {
      $("visorImg").src = foto.src;
      $("visorImg").alt = foto.titulo || "";
      $("visor").hidden = false;
    }
    $("visor").addEventListener("click", () => { $("visor").hidden = true; });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("visor").hidden = true; });

    // ---------- Pantalla de espera: puntitos de colores ----------
    (() => {
      const lienzo = $("puntos"), caja = $("vacio"), ctx = lienzo.getContext("2d");
      const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let puntos = [], w = 0, h = 0, raf = 0, t0 = performance.now();
      // Estrellas con profundidad (paralaje): todas viajan juntas en la misma dirección,
      // pero las cercanas se mueven mucho y las lejanas casi nada. El brillo NO depende
      // de la distancia (como en el cielo real): cada estrella tiene su propia magnitud;
      // la mayoría son tenues y unas pocas muy brillantes, cerca o lejos.
      const TONOS = [188, 268, 318];
      function medir() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = caja.clientWidth; h = caja.clientHeight;
        lienzo.width = w * dpr; lienzo.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const n = Math.round(Math.min(190, Math.max(90, (w * h) / 2900)));
        puntos = Array.from({ length: n }, (_, i) => {
          const z = Math.pow(Math.random(), 1.8);        // profundidad: 0 = muy lejos, 1 = cerca
          const mag = Math.pow(Math.random(), 3);       // brillo propio: casi todas tenues, pocas brillantes
          return {
            x: Math.random() * w, y: Math.random() * h, z, mag,
            vel: 0.25 + 26 * z * z,                      // px por segundo: lejos ≈ quietas, cerca ≈ rápidas
            hue: TONOS[i % TONOS.length] + (Math.random() - 0.5) * 22,
            sat: 35 + mag * 60,                           // las brillantes, con más color
            fase: Math.random() * Math.PI * 2, ritmo: 0.25 + Math.random() * 0.6,
          };
        });
      }
      // Dirección del viaje: diagonal suave que gira muy despacio.
      let rumbo = Math.random() * Math.PI * 2;
      function cuadro(t) {
        const dt = Math.min(50, t - t0) / 1000; t0 = t;
        ctx.clearRect(0, 0, w, h);
        ctx.globalCompositeOperation = "lighter";
        if (!quieto) rumbo += dt * 0.01;
        const dx = Math.cos(rumbo), dy = Math.sin(rumbo);
        for (const p of puntos) {
          if (!quieto) {
            p.fase += dt * p.ritmo;
            p.x += dx * p.vel * dt;
            p.y += dy * p.vel * dt;
            if (p.x < -20) p.x += w + 40; else if (p.x > w + 20) p.x -= w + 40;
            if (p.y < -20) p.y += h + 40; else if (p.y > h + 20) p.y -= h + 40;
          }
          // centelleo leve, independiente de la distancia
          const brillo = (0.25 + 0.75 * p.mag) * (0.85 + 0.15 * Math.sin(p.fase));
          const nucleo = 0.6 + p.mag * 1.5;
          if (p.mag > 0.3) {
            // halo solo para las brillantes (estén cerca o lejos)
            const color = `hsla(${p.hue}, ${p.sat}%, 65%,`;
            const radio = nucleo * 5;
            const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radio);
            g.addColorStop(0, color + (0.8 * brillo) + ")");
            g.addColorStop(0.3, color + (0.25 * brillo) + ")");
            g.addColorStop(1, color + "0)");
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(p.x, p.y, radio, 0, Math.PI * 2); ctx.fill();
          }
          ctx.fillStyle = `hsla(${p.hue}, ${p.sat * 0.6}%, 90%, ${Math.min(1, brillo * 1.3)})`;
          ctx.beginPath(); ctx.arc(p.x, p.y, nucleo, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalCompositeOperation = "source-over";
        raf = quieto ? 0 : requestAnimationFrame(cuadro);
      }
      function arrancar() {
        cancelAnimationFrame(raf); raf = 0;
        if (caja.hidden) return;              // sin animación cuando ya hay láminas
        medir(); t0 = performance.now(); cuadro(t0);
      }
      new MutationObserver(arrancar).observe(caja, { attributes: true, attributeFilter: ["hidden"] });
      addEventListener("resize", () => { if (!caja.hidden) medir(); });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else arrancar();
      });
      arrancar();
    })();

    // Mantener la pantalla encendida durante la clase (si el navegador lo permite).
    let candado = null;
    async function mantenerDespierto() {
      try { candado = await navigator.wakeLock?.request("screen"); } catch {}
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") mantenerDespierto();
    });
    mantenerDespierto();
  </script>
</body>
</html>
