<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#11152b">
  <title>Fotos de la clase</title>
  <link rel="stylesheet" href="revelar.css?v=202611050456">
  <link rel="manifest" href="alumno.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="iconos/alumno-192.png">
  <link rel="apple-touch-icon" href="iconos/alumno-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reveal Class">
  <script type="module" src="js/pwa.js?v=202611050456"></script>
</head>
<body class="sala">
  <!-- Sin barra superior: solo el contenido. Si se pierde la conexión, aparece un aviso discreto. -->
  <div id="sinRed" class="sin-red" hidden data-i18n="reconnecting">Sin conexión… reconectando</div>
  <div id="aviso" class="aviso" hidden></div>

  <!-- Mis clases: sobre las estrellas, la lista de maestros que sigue este alumno.
       Un toque en un maestro = entrar a su clase. Hasta abajo, «Agregar maestro». -->
  <section class="mis-clases" id="misClases" aria-labelledby="mcTitulo">
    <h2 class="mc-titulo" id="mcTitulo" data-i18n="whichClass">¿A qué clase vas a entrar?</h2>
    <ul class="mc-lista" id="mcLista"></ul>
    <button class="mc-agregar" id="mcAgregar" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="addTeacher">Agregar maestro</span>
    </button>
    <form class="mc-nuevo" id="mcNuevo" hidden novalidate autocomplete="off">
      <div class="mc-capsula">
        <input id="mcCodigo" maxlength="8" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"
               placeholder="Código del maestro" data-i18n-ph="classCode" aria-describedby="mcEstado">
        <button class="mc-entrar" id="mcEntrar" type="submit" disabled data-i18n="enterBtn">Entrar</button>
      </div>
      <p class="mc-estado" id="mcEstado" role="status"></p>
    </form>
    <p class="mc-ayuda" id="mcAyuda" data-i18n="holdToRemove">Mantén presionado un maestro para quitarlo.</p>
  </section>
  <main class="lista" id="lista" aria-live="polite">
    <!-- Espera: puntitos de colores que brillan y flotan despacio -->
    <div class="vacio espera" id="vacio" aria-label="Esperando" data-i18n-aria="waiting">
      <canvas id="puntos" aria-hidden="true"></canvas>
    </div>
  </main>

  <div class="visor" id="visor" hidden><img id="visorImg" alt=""></div>

  <!-- Dentro de una clase: regresar a la lista de maestros -->
  <a class="btn-volver" id="btnVolver" href="./" hidden aria-label="Atrás" data-i18n-aria="back">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <script type="module">
    import { CONFIG } from "./config.js?v=202611050456";
    import { crearStore, crearCatalogo, limpiarCodigo, sesionActual, ordenar, esTemporal, idReal, esFoco, FOCO } from "./js/store.js?v=202611050456";
    import "./js/presion.js?v=202611050456";
    import "./js/sinfoco.js?v=202611050456";   // ventanas: aparecen desde el botón que tocaste y regresan a él
    import { confirmarQuitar } from "./js/confirmar.js?v=202611050456";
    import { idioma, t, traducir, usarIdioma } from "./js/i18n.js?v=202611050456";
    import { textoAHtml, cuerpoHtml, esEscritura, esSubida, ponerFondo } from "./js/escritura.js?v=202611050456";
    // fotos.js se pide siempre fresco: así un cambio de fotos se ve al recargar,
    // sin esperar los 10 minutos de caché de GitHub Pages.
    const { FOTOS } = await import("./fotos.js?v=" + Date.now());

    const $ = (id) => document.getElementById(id);
    const porId = new Map(FOTOS.map((f) => [f.id, f]));
    const tarjetas = new Map();          // id → <figure>
    const bajas = new Map();             // id → función para dejar de escuchar una escritura
    let primeraCarga = true;
    let ultimoFoco = null;

    idioma();             // el del teléfono, o el elegido en este teléfono
    // Idioma del alumno: el del último maestro con el que se conectó; la primera vez, inglés.
    // (Con la liga de un maestro, el de ese maestro.)
    {
      let l = []; try { l = JSON.parse(localStorage.getItem("revelar:maestros")) || []; } catch {}
      const p = new URLSearchParams(location.search).get("p");
      const deLiga = p && l.find((m) => m.codigo === String(p).toLowerCase());
      const ultimo = l.filter((m) => m.codigo && m.idioma).sort((a, b) => (b.usado || 0) - (a.usado || 0))[0];
      usarIdioma((deLiga?.idioma) || ultimo?.idioma || "en");
    }
    traducir();
    document.title = t("classPhotos");

    // Un solo enlace para siempre: sin ?s= se sigue la lección que el presentador
    // puso en vivo. Si cambia de lección, la página se recarga sola.
    // ?p=<código> sigue la lección en vivo de ese maestro; sin código, la del presentador original.
    // ---------- Mis clases (los maestros que sigue este alumno, guardados en este teléfono) ----------
    // Abrir el app (sin ?p=) nunca entra solo a una clase: muestra la lista sobre las estrellas.
    // Con ?p=<código> (QR o liga del maestro) sí entra directo, y ese maestro queda en la lista.
    const param = new URLSearchParams(location.search);
    const MIS = "revelar:maestros";
    const leerMis = () => { try { return (JSON.parse(localStorage.getItem(MIS)) || []).filter((m) => m.codigo); } catch { return []; } };
    const guardarMis = (l) => { try { localStorage.setItem(MIS, JSON.stringify(l)); } catch {} };
    // "" = la lista; null = sesión fija (?s=)
    const codigoActual = param.has("s") ? null : (limpiarCodigo(param.get("p")) || "");
    if (codigoActual) {
      const l = leerMis();
      const m = l.find((x) => x.codigo === codigoActual);
      if (m) m.usado = Date.now(); else l.push({ codigo: codigoActual, nombre: "", usado: Date.now() });
      guardarMis(l);
    }
    $("btnVolver").hidden = !codigoActual;
    // Con la liga de un maestro (?p=) no sale ninguna lista: solo las estrellas mientras espera
    $("misClases").hidden = !!codigoActual || codigoActual === null;
    const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    const escapar = (x) => String(x ?? "").replace(/[&<>"']/g, (c) => ESC[c]);
    const nombreDe = (m) => m.nombre || t("teacherWith", { c: m.codigo });
    const irA = (codigo) => { location.href = codigo ? "./?p=" + encodeURIComponent(codigo) : "./"; };
    const catP = crearCatalogo().catch(() => null);

    const vivos = new Map();          // código → ¿está transmitiendo ahora?
    const oyendo = new Set();
    function pintarClases() {
      const l = leerMis().sort((a, b) => (b.usado || 0) - (a.usado || 0));
      $("mcLista").innerHTML = l.map((m) => {
        const actual = m.codigo === codigoActual, vivo = vivos.get(m.codigo);
        return `<li><button type="button" class="mc-ir${actual ? " actual" : ""}${vivo ? " vivo" : ""}" data-c="${escapar(m.codigo)}">
            <span class="mc-quien"><b>${escapar(nombreDe(m))}</b><small>${escapar(m.codigo)}</small></span>
            ${actual ? `<span class="mc-estado-fila">${escapar(t("waiting"))}…</span>`
              : vivo ? `<span class="mc-vivo">${escapar(t("live"))}</span>` : ""}
            <svg class="mc-flecha" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </button></li>`;
      }).join("");
      $("mcLista").hidden = !l.length;
      $("mcAyuda").hidden = !l.length;
      // Sin maestros todavía: el cuadro para escribir el código ya viene abierto
      if (!l.length) abrirNuevo(false);
      // Nombres y «En vivo» se piden una sola vez por maestro
      catP.then((cat) => {
        if (!cat) return;
        l.forEach((m) => {
          if (oyendo.has(m.codigo)) return;
          oyendo.add(m.codigo);
          cat.onActual(m.codigo, (a) => { if (vivos.get(m.codigo) !== !!a) { vivos.set(m.codigo, !!a); pintarClases(); } });
          // Idioma del maestro: se guarda con él; si es el maestro actual (o el último), la pantalla cambia
          cat.idiomaDeCodigo?.(m.codigo).then((lang) => {
            if (!lang) return;
            const l2 = leerMis(); const x = l2.find((y) => y.codigo === m.codigo);
            if (!x || x.idioma === lang) return;
            x.idioma = lang; guardarMis(l2);
            const manda = codigoActual ? m.codigo === codigoActual : l2.sort((a, b) => (b.usado || 0) - (a.usado || 0))[0]?.codigo === m.codigo;
            if (manda && idioma() !== lang) { usarIdioma(lang); traducir(); document.title = t("classPhotos"); pintarClases(); }
          }).catch(() => {});
          if (!m.nombre) cat.nombreDeCodigo?.(m.codigo).then((n) => {
            if (!n) return;
            const l2 = leerMis(); const x = l2.find((y) => y.codigo === m.codigo);
            if (x) { x.nombre = n; guardarMis(l2); pintarClases(); }
          }).catch(() => {});
        });
      });
    }
    // Un toque = entrar. Mantener presionado = quitar (así no hacen falta más botones).
    let presion = null, fueLargo = false;
    $("mcLista").addEventListener("pointerdown", (e) => {
      const b = e.target.closest(".mc-ir"); if (!b) return;
      fueLargo = false;
      presion = setTimeout(async () => {
        fueLargo = true; b.classList.add("quitando");
        const m = leerMis().find((x) => x.codigo === b.dataset.c);
        if (await confirmarQuitar(m ? nombreDe(m) : b.dataset.c, t)) {
          guardarMis(leerMis().filter((x) => x.codigo !== b.dataset.c));
        }
        pintarClases();
      }, 650);
    });
    ["pointerup", "pointerleave", "pointercancel", "scroll"].forEach((ev) =>
      $("mcLista").addEventListener(ev, () => clearTimeout(presion), true));
    $("mcLista").addEventListener("contextmenu", (e) => e.preventDefault());
    $("mcLista").addEventListener("click", (e) => {
      const b = e.target.closest(".mc-ir"); if (!b || fueLargo) return;
      if (b.dataset.c === codigoActual) return;
      b.classList.add("yendo");
      setTimeout(() => irA(b.dataset.c), 220);
    });

    // Agregar maestro: escribes el código y el app busca su nombre; «Entrar» lo guarda y entra.
    let encontrado = null, busca = null, turno = 0;
    function abrirNuevo(enfocar = true) {
      $("mcAgregar").hidden = true; $("mcNuevo").hidden = false;
      if (enfocar) setTimeout(() => $("mcCodigo").focus(), 30);
    }
    $("mcAgregar").addEventListener("click", () => abrirNuevo());
    $("mcCodigo").addEventListener("input", () => {
      const el = $("mcCodigo");
      const limpio = el.value.toLowerCase().replace(/[^a-z0-9]/g, "");
      if (limpio !== el.value) el.value = limpio;
      encontrado = null; $("mcEntrar").disabled = true;
      $("mcNuevo").classList.remove("ok", "error");
      clearTimeout(busca);
      if (limpio.length < 4) { $("mcEstado").textContent = ""; return; }
      $("mcEstado").textContent = t("searching");
      const mio = ++turno;
      busca = setTimeout(async () => {
        let n = null;
        let lang = null;
        try {
          const cat = await catP;
          [n, lang] = await Promise.all([cat?.nombreDeCodigo?.(limpio).catch(() => null), cat?.idiomaDeCodigo?.(limpio).catch(() => null)]);
          // Maestro que aún no publica su nombre, pero está transmitiendo: también vale
          if (!n && await cat?.leerActual?.(limpio).catch(() => null)) n = t("teacherWith", { c: limpio });
        } catch {}
        if (mio !== turno) return;
        if (n) {
          encontrado = { codigo: limpio, nombre: n, ...(lang ? { idioma: lang } : {}) };
          $("mcEstado").textContent = "✓ " + n;
          $("mcNuevo").classList.add("ok"); $("mcEntrar").disabled = false;
        } else {
          $("mcEstado").textContent = t("codeNotFound");
          $("mcNuevo").classList.add("error");
        }
      }, 350);
    });
    $("mcNuevo").addEventListener("submit", (e) => {
      e.preventDefault();
      if (!encontrado) { $("mcNuevo").classList.remove("sacude"); void $("mcNuevo").offsetWidth; $("mcNuevo").classList.add("sacude"); return; }
      const l = leerMis().filter((m) => m.codigo !== encontrado.codigo);
      l.push({ ...encontrado, usado: Date.now() });
      guardarMis(l);
      $("mcNuevo").classList.add("yendo");
      setTimeout(() => irA(encontrado.codigo), 300);
    });
    pintarClases();

    let sesion = sesionActual();
    if (!param.has("s")) {
      sesion = "sin-leccion-" + (codigoActual || "lista");     // en la lista no se sigue ninguna clase
      if (codigoActual) {
        try {
          const cat = await catP;
          const actual = await cat.leerActual(codigoActual);
          // Sin clase en vivo: se espera en las estrellas (nunca se muestra una clase que ya terminó)
          const espera = sesion;
          if (actual) sesion = actual;
          cat.onActual(codigoActual, (a) => { if ((a || espera) !== sesion) location.reload(); });
        } catch {}
      }
    }
    const store = await crearStore(sesion);
    if (store.modo === "demo") {
      $("aviso").hidden = false;
      $("aviso").textContent = t("demoParticipant");
    }

    let yaConecto = false;
    store.onConexion((ok) => {
      if (ok) yaConecto = true;
      $("sinRed").hidden = ok || !yaConecto; // solo avisa si se cayó después de conectar
    });
    store.registrarPresencia();
    store.onReveladas(pintar, () => {
      $("aviso").hidden = false;
      $("aviso").textContent = t("participantReadFail");
    });

    // Escritura: tarjeta de texto que se actualiza sola si el presentador la edita
    // (por ejemplo, cuando resalta palabras en plena clase).
    function crearTarjetaEscritura(id) {
      const fig = document.createElement("figure");
      fig.className = "foto escritura entrando";
      fig.dataset.id = id;
      fig.innerHTML = `<div class="verso"><p></p><cite></cite></div><figcaption><span class="orden"></span></figcaption>`;
      bajas.set(id, store.onEscritura(id, (e) => {
        if (!e) return;
        fig.classList.toggle("es-lamina", !!e.lamina);          // lámina de texto libre (como en PowerPoint)
        ponerFondo(fig, e);                                      // su color de fondo (si el maestro eligió uno)
        fig.querySelector(".verso p, .verso .lam").outerHTML = cuerpoHtml(e);
        fig.querySelector(".verso cite").textContent = e.lamina ? "" : (e.cita || "");
      }));
      return fig;
    }

    function crearTarjeta(foto) {
      const fig = document.createElement("figure");
      fig.className = "foto entrando";
      fig.dataset.id = foto.id;
      const img = document.createElement("img");
      img.src = foto.src;
      img.alt = foto.titulo || "";
      img.decoding = "async";
      const cap = document.createElement("figcaption");
      const orden = document.createElement("span");
      orden.className = "orden";
      cap.append(orden);
      if (foto.titulo) cap.append(document.createTextNode(foto.titulo));
      fig.append(img, cap);
      fig.addEventListener("click", () => abrirVisor({ src: img.src, titulo: foto.titulo }));
      return fig;
    }

    // Foto subida desde el presentador con "+": la imagen viene de Firebase.
    // Fotos: la del repo (si existe) o la de Firebase. Si el presentador cambia
    // la foto, Firebase la reemplaza al momento.
    function crearTarjetaFoto(id) {
      const original = porId.get(id);
      const fig = crearTarjeta({ id, src: original?.src || "" });
      const img = fig.querySelector("img");
      if (!original) img.removeAttribute("src");
      bajas.set(id, store.onSubida(id, (f) => {
        const nuevo = f?.src || original?.src;
        if (nuevo && img.getAttribute("src") !== nuevo) img.src = nuevo;
      }));
      return fig;
    }

    // Una clase que se quedó encendida (el maestro cerró sin terminarla) se da por terminada
    // si no se ha revelado nada en 8 horas: el alumno ve las estrellas, no la última lámina.
    const VIEJA = 8 * 3600 * 1000;
    function pintar(reveladas) {
      const tiempos = Object.values(reveladas || {}).filter((v) => typeof v === "number");
      if (tiempos.length && Date.now() - Math.max(...tiempos) > VIEJA) reveladas = {};
      // Lo revelado en orden lleva número; un desvío (tocado fuera de orden) no.
      const ids = [], temporal = new Set();
      ordenar(reveladas).forEach((k) => {
        const id = idReal(k);
        if (!(porId.has(id) || esEscritura(id) || esSubida(id)) || ids.includes(id)) return;
        ids.push(id);
        if (esTemporal(k)) temporal.add(id);
      });
      const visibles = new Set(ids);
      const lista = $("lista");

      // Quitar las que el presentador ocultó.
      let huboBajas = false;
      for (const [id, fig] of tarjetas) {
        if (visibles.has(id)) continue;
        huboBajas = true;
        tarjetas.delete(id);
        const baja = bajas.get(id);
        if (baja) { try { baja(); } catch {} bajas.delete(id); }
        fig.style.maxHeight = fig.offsetHeight + "px";
        requestAnimationFrame(() => {
          fig.classList.add("saliendo");
          fig.style.maxHeight = "0px";
          fig.style.marginBottom = "-6px";
        });
        setTimeout(() => fig.remove(), 480);
      }

      // Agregar / ordenar las visibles.
      let nueva = null, n = 0;
      ids.forEach((id) => {
        let fig = tarjetas.get(id);
        if (!fig) {
          fig = esEscritura(id) ? crearTarjetaEscritura(id) : crearTarjetaFoto(id);
          tarjetas.set(id, fig);
          nueva = fig;
          requestAnimationFrame(() => requestAnimationFrame(() => fig.classList.remove("entrando")));
        }
        fig.querySelector(".orden").textContent = temporal.has(id) ? "" : String(++n).padStart(2, "0");
        lista.append(fig); // append mueve el nodo: deja la lista en orden
      });

      $("vacio").hidden = ids.length > 0;
      document.body.classList.toggle("con-clase", ids.length > 0);   // con la clase en pantalla, la cápsula del código se esconde

      // El presentador tocó una lámina que ya pasó: regresar a ella.
      const foco = Object.keys(reveladas || {}).filter(esFoco)
        .sort((a, b) => reveladas[a] - reveladas[b]).pop();
      const marcaFoco = foco ? foco + ":" + reveladas[foco] : null;
      if (marcaFoco && marcaFoco !== ultimoFoco) {
        ultimoFoco = marcaFoco;
        const fig = tarjetas.get(foco.slice(FOCO.length));
        if (fig) {
          setTimeout(() => fig.scrollIntoView({ behavior: primeraCarga ? "auto" : "smooth", block: "start" }), 80);
          primeraCarga = false;
          return;
        }
      }
      // Terminó el repaso (el presentador tocó Siguiente): volver a la última.
      if (!marcaFoco && ultimoFoco && !nueva && ids.length) {
        const ultimaFig = tarjetas.get(ids[ids.length - 1]);
        setTimeout(() => ultimaFig?.scrollIntoView({ behavior: "smooth", block: "start" }), 80);
      }
      if (!marcaFoco) ultimoFoco = null;

      // El presentador retrocedió (↶): quedarse en la que ahora es la última.
      if (!nueva && huboBajas && !primeraCarga && ids.length) {
        const ultimaFig = tarjetas.get(ids[ids.length - 1]);
        setTimeout(() => ultimaFig?.scrollIntoView({ behavior: "smooth", block: "start" }), 500);
      }

      if (nueva && !primeraCarga) {
        document.querySelectorAll(".foto.nueva").forEach((f) => f.classList.remove("nueva"));
        nueva.classList.add("nueva");
        setTimeout(() => nueva.classList.remove("nueva"), 2600);
        setTimeout(() => nueva.scrollIntoView({ behavior: "smooth", block: "start" }), 80);
        if (navigator.vibrate) navigator.vibrate(30);
      }
      primeraCarga = false;
    }

    function abrirVisor(foto) {
      $("visorImg").src = foto.src;
      $("visorImg").alt = foto.titulo || "";
      $("visor").hidden = false;
    }
    $("visor").addEventListener("click", () => { $("visor").hidden = true; });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("visor").hidden = true; });

    // ---------- Pantalla de espera: puntitos de colores ----------
    (() => {
      const lienzo = $("puntos"), caja = $("vacio"), ctx = lienzo.getContext("2d");
      const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let puntos = [], w = 0, h = 0, raf = 0, t0 = performance.now();
      // Estrellas con profundidad (paralaje): todas viajan juntas en la misma dirección,
      // pero las cercanas se mueven mucho y las lejanas casi nada. El brillo NO depende
      // de la distancia (como en el cielo real): cada estrella tiene su propia magnitud;
      // la mayoría son tenues y unas pocas muy brillantes, cerca o lejos.
      const TONOS = [188, 268, 318];
      function medir() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = caja.clientWidth; h = caja.clientHeight;
        lienzo.width = w * dpr; lienzo.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const n = Math.round(Math.min(190, Math.max(90, (w * h) / 2900)));
        puntos = Array.from({ length: n }, (_, i) => {
          const z = Math.pow(Math.random(), 1.8);        // profundidad: 0 = muy lejos, 1 = cerca
          const mag = Math.pow(Math.random(), 3);       // brillo propio: casi todas tenues, pocas brillantes
          return {
            x: Math.random() * w, y: Math.random() * h, z, mag,
            vel: 0.25 + 26 * z * z,                      // px por segundo: lejos ≈ quietas, cerca ≈ rápidas
            hue: TONOS[i % TONOS.length] + (Math.random() - 0.5) * 22,
            sat: 35 + mag * 60,                           // las brillantes, con más color
            fase: Math.random() * Math.PI * 2, ritmo: 0.25 + Math.random() * 0.6,
          };
        });
      }
      // Dirección del viaje: diagonal suave que gira muy despacio.
      let rumbo = Math.random() * Math.PI * 2;
      function cuadro(t) {
        const dt = Math.min(50, t - t0) / 1000; t0 = t;
        ctx.clearRect(0, 0, w, h);
        ctx.globalCompositeOperation = "lighter";
        if (!quieto) rumbo += dt * 0.01;
        const dx = Math.cos(rumbo), dy = Math.sin(rumbo);
        for (const p of puntos) {
          if (!quieto) {
            p.fase += dt * p.ritmo;
            p.x += dx * p.vel * dt;
            p.y += dy * p.vel * dt;
            if (p.x < -20) p.x += w + 40; else if (p.x > w + 20) p.x -= w + 40;
            if (p.y < -20) p.y += h + 40; else if (p.y > h + 20) p.y -= h + 40;
          }
          // centelleo leve, independiente de la distancia
          const brillo = (0.25 + 0.75 * p.mag) * (0.85 + 0.15 * Math.sin(p.fase));
          const nucleo = 0.6 + p.mag * 1.5;
          if (p.mag > 0.3) {
            // halo solo para las brillantes (estén cerca o lejos)
            const color = `hsla(${p.hue}, ${p.sat}%, 65%,`;
            const radio = nucleo * 5;
            const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radio);
            g.addColorStop(0, color + (0.8 * brillo) + ")");
            g.addColorStop(0.3, color + (0.25 * brillo) + ")");
            g.addColorStop(1, color + "0)");
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(p.x, p.y, radio, 0, Math.PI * 2); ctx.fill();
          }
          ctx.fillStyle = `hsla(${p.hue}, ${p.sat * 0.6}%, 90%, ${Math.min(1, brillo * 1.3)})`;
          ctx.beginPath(); ctx.arc(p.x, p.y, nucleo, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalCompositeOperation = "source-over";
        raf = quieto ? 0 : requestAnimationFrame(cuadro);
      }
      function arrancar() {
        cancelAnimationFrame(raf); raf = 0;
        if (caja.hidden) return;              // sin animación cuando ya hay láminas
        medir(); t0 = performance.now(); cuadro(t0);
      }
      new MutationObserver(arrancar).observe(caja, { attributes: true, attributeFilter: ["hidden"] });
      addEventListener("resize", () => { if (!caja.hidden) medir(); });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else arrancar();
      });
      arrancar();
    })();

    // Mantener la pantalla encendida durante la clase (si el navegador lo permite).
    let candado = null;
    async function mantenerDespierto() {
      try { candado = await navigator.wakeLock?.request("screen"); } catch {}
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") mantenerDespierto();
    });
    mantenerDespierto();
  </script>
</body>
</html>
