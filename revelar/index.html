<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#11152b">
  <title>Fotos de la clase</title>
  <link rel="stylesheet" href="revelar.css?v=202610281444">
</head>
<body class="sala">
  <!-- Sin barra superior: solo el contenido. Si se pierde la conexión, aparece un aviso discreto. -->
  <div id="sinRed" class="sin-red" hidden>Sin conexión… reconectando</div>
  <div id="aviso" class="aviso" hidden></div>

  <main class="lista" id="lista" aria-live="polite">
    <div class="vacio" id="vacio">
      <div class="icono" aria-hidden="true">📷</div>
      <p>Esperando la primera foto…</p>
      <small>Deja esta página abierta. Las fotos aparecerán aquí solas.</small>
    </div>
  </main>

  <div class="visor" id="visor" hidden><img id="visorImg" alt=""></div>

  <script type="module">
    import { CONFIG } from "./config.js?v=202610281444";
    import { crearStore, sesionActual, ordenar, esTemporal, idReal, esFoco, FOCO } from "./js/store.js?v=202610281444";
    import { textoAHtml, esEscritura, esSubida } from "./js/escritura.js?v=202610281444";
    // fotos.js se pide siempre fresco: así un cambio de fotos se ve al recargar,
    // sin esperar los 10 minutos de caché de GitHub Pages.
    const { FOTOS } = await import("./fotos.js?v=" + Date.now());

    const $ = (id) => document.getElementById(id);
    const porId = new Map(FOTOS.map((f) => [f.id, f]));
    const tarjetas = new Map();          // id → <figure>
    const bajas = new Map();             // id → función para dejar de escuchar una escritura
    let primeraCarga = true;
    let ultimoFoco = null;

    document.title = CONFIG.titulo;

    const store = await crearStore(sesionActual());
    if (store.modo === "demo") {
      $("aviso").hidden = false;
      $("aviso").textContent = "Modo demo: Firebase aún no está configurado. Solo se sincroniza con otras pestañas de este navegador.";
    }

    let yaConecto = false;
    store.onConexion((ok) => {
      if (ok) yaConecto = true;
      $("sinRed").hidden = ok || !yaConecto; // solo avisa si se cayó después de conectar
    });
    store.registrarPresencia();
    store.onReveladas(pintar, () => {
      $("aviso").hidden = false;
      $("aviso").textContent = "No se pudo leer la sesión. Revisa las reglas de Firebase.";
    });

    // Escritura: tarjeta de texto que se actualiza sola si el presentador la edita
    // (por ejemplo, cuando resalta palabras en plena clase).
    function crearTarjetaEscritura(id) {
      const fig = document.createElement("figure");
      fig.className = "foto escritura entrando";
      fig.dataset.id = id;
      fig.innerHTML = `<div class="verso"><p></p><cite></cite></div><figcaption><span class="orden"></span></figcaption>`;
      bajas.set(id, store.onEscritura(id, (e) => {
        if (!e) return;
        fig.querySelector(".verso p").innerHTML = textoAHtml(e.texto, e.todoRojo);
        fig.querySelector(".verso cite").textContent = e.cita || "";
      }));
      return fig;
    }

    function crearTarjeta(foto) {
      const fig = document.createElement("figure");
      fig.className = "foto entrando";
      fig.dataset.id = foto.id;
      const img = document.createElement("img");
      img.src = foto.src;
      img.alt = foto.titulo || "";
      img.decoding = "async";
      const cap = document.createElement("figcaption");
      const orden = document.createElement("span");
      orden.className = "orden";
      cap.append(orden);
      if (foto.titulo) cap.append(document.createTextNode(foto.titulo));
      fig.append(img, cap);
      fig.addEventListener("click", () => abrirVisor({ src: img.src, titulo: foto.titulo }));
      return fig;
    }

    // Foto subida desde el presentador con "+": la imagen viene de Firebase.
    function crearTarjetaSubida(id) {
      const fig = crearTarjeta({ id, src: "" });
      const img = fig.querySelector("img");
      img.removeAttribute("src");
      bajas.set(id, store.onSubida(id, (f) => { if (f?.src && img.src !== f.src) img.src = f.src; }));
      return fig;
    }

    function pintar(reveladas) {
      // Lo revelado en orden lleva número; un desvío (tocado fuera de orden) no.
      const ids = [], temporal = new Set();
      ordenar(reveladas).forEach((k) => {
        const id = idReal(k);
        if (!(porId.has(id) || esEscritura(id) || esSubida(id)) || ids.includes(id)) return;
        ids.push(id);
        if (esTemporal(k)) temporal.add(id);
      });
      const visibles = new Set(ids);
      const lista = $("lista");

      // Quitar las que el presentador ocultó.
      for (const [id, fig] of tarjetas) {
        if (visibles.has(id)) continue;
        tarjetas.delete(id);
        const baja = bajas.get(id);
        if (baja) { try { baja(); } catch {} bajas.delete(id); }
        fig.style.maxHeight = fig.offsetHeight + "px";
        requestAnimationFrame(() => {
          fig.classList.add("saliendo");
          fig.style.maxHeight = "0px";
          fig.style.marginBottom = "-6px";
        });
        setTimeout(() => fig.remove(), 480);
      }

      // Agregar / ordenar las visibles.
      let nueva = null, n = 0;
      ids.forEach((id) => {
        let fig = tarjetas.get(id);
        if (!fig) {
          fig = esEscritura(id) ? crearTarjetaEscritura(id)
              : esSubida(id) ? crearTarjetaSubida(id)
              : crearTarjeta(porId.get(id));
          tarjetas.set(id, fig);
          nueva = fig;
          requestAnimationFrame(() => requestAnimationFrame(() => fig.classList.remove("entrando")));
        }
        fig.querySelector(".orden").textContent = temporal.has(id) ? "" : String(++n).padStart(2, "0");
        lista.append(fig); // append mueve el nodo: deja la lista en orden
      });

      $("vacio").hidden = ids.length > 0;

      // El presentador tocó una lámina que ya pasó: regresar a ella.
      const foco = Object.keys(reveladas || {}).filter(esFoco)
        .sort((a, b) => reveladas[a] - reveladas[b]).pop();
      const marcaFoco = foco ? foco + ":" + reveladas[foco] : null;
      if (marcaFoco && marcaFoco !== ultimoFoco) {
        ultimoFoco = marcaFoco;
        const fig = tarjetas.get(foco.slice(FOCO.length));
        if (fig) {
          setTimeout(() => fig.scrollIntoView({ behavior: primeraCarga ? "auto" : "smooth", block: "start" }), 80);
          primeraCarga = false;
          return;
        }
      }
      if (!marcaFoco) ultimoFoco = null;

      if (nueva && !primeraCarga) {
        document.querySelectorAll(".foto.nueva").forEach((f) => f.classList.remove("nueva"));
        nueva.classList.add("nueva");
        setTimeout(() => nueva.classList.remove("nueva"), 2600);
        setTimeout(() => nueva.scrollIntoView({ behavior: "smooth", block: "start" }), 80);
        if (navigator.vibrate) navigator.vibrate(30);
      }
      primeraCarga = false;
    }

    function abrirVisor(foto) {
      $("visorImg").src = foto.src;
      $("visorImg").alt = foto.titulo || "";
      $("visor").hidden = false;
    }
    $("visor").addEventListener("click", () => { $("visor").hidden = true; });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("visor").hidden = true; });

    // Mantener la pantalla encendida durante la clase (si el navegador lo permite).
    let candado = null;
    async function mantenerDespierto() {
      try { candado = await navigator.wakeLock?.request("screen"); } catch {}
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") mantenerDespierto();
    });
    mantenerDespierto();
  </script>
</body>
</html>
