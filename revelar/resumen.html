<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#faf8f4">
  <title>Berean Reveal</title>
  <link rel="icon" type="image/png" sizes="192x192" href="iconos/maestro-192.png">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf8f4; color: #1d1a16;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    p { font-size: 18px; max-width: 420px; line-height: 1.5; }
  </style>
</head>
<body>
  <p id="msg">…</p>
  <script type="module">
    // Resumen compartido por enlace: cada lámina en orden con sus notas. Solo lectura, sin cuenta.
    import { leerCompartida } from "./js/store.js?v=202610310759";
    import { idioma, t } from "./js/i18n.js?v=202610310759";
    import { crearResumen, armarLista } from "./js/resumen.js?v=202610310759";
    idioma();
    const msg = document.getElementById("msg");
    msg.textContent = t("loading");
    const sesion = new URLSearchParams(location.search).get("l") || "";
    try {
      const datos = /^[A-Za-z0-9_-]{1,40}$/.test(sesion) ? await leerCompartida(sesion) : null;
      if (!datos) { msg.textContent = t("summaryGone"); }
      else {
        const { lista, saltadas } = armarLista(datos);
        const html = await crearResumen({ lista, saltadas, notas: datos.notas, titulo: datos.titulo });
        document.open(); document.write(html); document.close();
      }
    } catch (e) { msg.textContent = t("summaryGone"); }
  </script>
</body>
</html>
