<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#11152b">
  <title>Maestros · Revelar</title>
  <link rel="stylesheet" href="revelar.css?v=202610301208">
</head>
<body class="pag-lecciones pag-maestros">
  <header class="barra">
    <a class="btn-barra" href="lecciones.html#lista" aria-label="Mis lecciones" title="Mis lecciones" data-i18n-title="myLessons">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 class="lec-titulo" data-i18n="teachersAdmin">Maestros</h1>
    <button class="btn adm-mapa-btn" id="btnMapa" type="button" hidden data-i18n="map">🗺 Mapa</button>
  </header>

  <section class="entrada" id="entrada" hidden>
    <h2 data-i18n="signInLessons">Entra para ver tus lecciones</h2>
    <button class="btn primario" id="btnEntrar" data-i18n="signInGoogle">Entrar con Google</button>
  </section>

  <main class="lec-main" id="main" hidden>
    <p class="lec-vacio" id="estadoAdmin" data-i18n="loading">Cargando…</p>
    <div class="adm-resumen" id="resumen" hidden></div>
    <section class="adm-mapa" id="mapaWrap" hidden>
      <div id="mapa" class="adm-mapa-lienzo"></div>
      <p class="adm-mapa-nota" id="mapaNota" data-i18n="mapNote">Solo aparecen los maestros que eligieron compartir su ciudad (aproximada).</p>
    </section>
    <div class="lec-lista" id="lista"></div>
  </main>

  <dialog id="dlgBloquear">
    <h2 id="bloqTitulo"></h2>
    <p id="bloqTexto"></p>
    <div class="acciones">
      <button class="btn" data-cerrar data-i18n="cancel">Cancelar</button>
      <button class="btn primario" id="btnBloqOk"></button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script type="module">
    import { crearCatalogo, esPermisoDenegado } from "./js/store.js?v=202610301208";
    import { idioma, t, traducir } from "./js/i18n.js?v=202610301208";

    const $ = (id) => document.getElementById(id);
    idioma("es");
    traducir();
    document.title = t("teachersAdmin") + " · Revelar";

    const cat = await crearCatalogo();
    let maestros = {}, bloqueados = {}, empezo = false, elegido = null;
    let mapaVisible = false, mapa = null, capa = null;
    const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    const escapar = (x) => String(x ?? "").replace(/[&<>"']/g, (c) => ESC[c]);
    const fecha = (ms) => ms ? new Date(ms).toLocaleDateString(t("locale"), { day: "numeric", month: "short", year: "numeric" }) : "—";

    cat.onUsuario((u) => {
      $("entrada").hidden = !!u;
      $("main").hidden = !u;
      if (!u || empezo) return;
      empezo = true;
      if (!cat.esAdmin()) { $("estadoAdmin").textContent = t("adminOnly"); return; }
      $("btnMapa").hidden = false;
      cat.onBloqueados((b) => { bloqueados = b || {}; pintar(); });
      cat.onMaestros((m) => { maestros = m || {}; pintar(); },
        (e) => { $("estadoAdmin").textContent = esPermisoDenegado(e) ? t("rulesMissing") : t("loadFail", { e: e?.message || e }); });
    });
    $("btnEntrar").addEventListener("click", () => cat.entrar().catch(() => {}));

    function pintar() {
      const lista = Object.entries(maestros).filter(([, m]) => m && typeof m === "object")
        .sort((a, b) => (b[1].activo || b[1].creado || 0) - (a[1].activo || a[1].creado || 0));
      $("estadoAdmin").hidden = lista.length > 0;
      if (!lista.length) $("estadoAdmin").textContent = t("noTeachers");
      const nBloq = lista.filter(([id]) => bloqueados[id]).length;
      const nLec = lista.reduce((s, [, m]) => s + (m.lecciones || 0), 0);
      if (mapaVisible) pintarMapa();
      $("resumen").hidden = !lista.length;
      $("resumen").innerHTML = `
        <div><b>${lista.length}</b><span>${escapar(t("teachersN"))}</span></div>
        <div><b>${nLec}</b><span>${escapar(t("lessons"))}</span></div>
        <div><b>${nBloq}</b><span>${escapar(t("blockedN"))}</span></div>`;
      const yo = cat.uid();
      $("lista").replaceChildren(...lista.map(([id, m]) => {
        const bloq = !!bloqueados[id];
        const el = document.createElement("article");
        el.className = "lec maestro" + (bloq ? " bloqueado" : "");
        el.innerHTML = `
          <div class="lec-abrir">
            <div class="lec-info">
              <h2>${escapar(m.nombre || t("noName"))}${id === yo ? ` <span class="adm-tu">${escapar(t("you"))}</span>` : ""}</h2>
              <p>${escapar(m.correo || "")}</p>
              ${m.ubicacion?.ciudad ? `<p>${escapar(t("locShared", { c: m.ubicacion.ciudad }))}</p>` : m.ubicacion ? `<p>${escapar(t("locShared", { c: m.ubicacion.lat + ", " + m.ubicacion.lng }))}</p>` : ""}
              <p><span class="adm-codigo">${escapar(m.codigo || "—")}</span> · ${m.lecciones || 0} ${escapar((m.lecciones || 0) === 1 ? t("lessonWord") : t("lessons").toLowerCase())} · ${escapar(t("lastActive"))} ${fecha(m.activo || m.creado)}</p>
              ${bloq ? `<span class="adm-estado">${escapar(t("blockedBadge"))}</span>` : ""}
            </div>
          </div>
          ${id === yo ? "" : `<button class="adm-btn ${bloq ? "" : "peligro"}" type="button">${escapar(bloq ? t("unblock") : t("block"))}</button>`}`;
        el.querySelector(".adm-btn")?.addEventListener("click", () => pedir(id, m, !bloq));
        return el;
      }));
    }

    // ---------- Mapa: maestros que compartieron su ciudad (aproximada) ----------
    function cargarLeaflet() {
      if (window.L) return Promise.resolve();
      return new Promise((ok, no) => {
        const css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
        document.head.append(css);
        const js = document.createElement("script");
        js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
        js.onload = ok; js.onerror = no;
        document.head.append(js);
      });
    }
    async function pintarMapa() {
      try { await cargarLeaflet(); } catch { $("mapaNota").textContent = t("mapFail"); return; }
      if (!mapa) {
        mapa = L.map("mapa", { worldCopyJump: true }).setView([20, -40], 2);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 12, attribution: "© OpenStreetMap",
        }).addTo(mapa);
        capa = L.layerGroup().addTo(mapa);
      }
      capa.clearLayers();
      const puntos = [];
      Object.entries(maestros).forEach(([id, m]) => {
        const u = m?.ubicacion;
        if (!u || typeof u.lat !== "number") return;
        const color = bloqueados[id] ? "#e57373" : "#e8c170";
        L.circleMarker([u.lat, u.lng], { radius: 9, color, weight: 2, fillColor: color, fillOpacity: 0.7 })
          .bindPopup(`<b>${escapar(m.nombre || t("noName"))}</b><br>${escapar(u.ciudad || "")}<br><span style="letter-spacing:.08em">${escapar(m.codigo || "")}</span>`)
          .addTo(capa);
        puntos.push([u.lat, u.lng]);
      });
      $("mapaNota").textContent = puntos.length ? t("mapNote") : t("noLocations");
      if (puntos.length === 1) mapa.setView(puntos[0], 6);
      else if (puntos.length > 1) mapa.fitBounds(puntos, { padding: [30, 30], maxZoom: 7 });
      setTimeout(() => mapa.invalidateSize(), 50);
    }
    $("btnMapa").addEventListener("click", () => {
      mapaVisible = !mapaVisible;
      $("mapaWrap").hidden = !mapaVisible;
      $("btnMapa").textContent = mapaVisible ? t("list") : t("map");
      $("lista").hidden = mapaVisible;
      $("resumen").hidden = mapaVisible || !Object.keys(maestros).length;
      if (mapaVisible) pintarMapa();
    });

    function pedir(id, m, bloquear) {
      elegido = { id, m, bloquear };
      const n = m.nombre || m.correo || m.codigo || "";
      $("bloqTitulo").textContent = bloquear ? t("blockQ", { n }) : t("unblockQ", { n });
      $("bloqTexto").textContent = bloquear ? t("blockText") : t("unblockText");
      $("btnBloqOk").textContent = bloquear ? t("block") : t("unblock");
      $("btnBloqOk").classList.toggle("peligro", bloquear);
      $("btnBloqOk").classList.toggle("lleno", bloquear);
      $("dlgBloquear").showModal();
    }
    $("btnBloqOk").addEventListener("click", async () => {
      $("dlgBloquear").close();
      if (!elegido) return;
      try {
        await cat.bloquear(elegido.id, elegido.m.codigo, elegido.bloquear);
        aviso(elegido.bloquear ? t("blockedToast") : t("unblockedToast"));
      } catch (e) { aviso(esPermisoDenegado(e) ? t("rulesMissing") : t("failed", { e: e?.message || e })); }
    });

    document.querySelectorAll("[data-cerrar]").forEach((b) =>
      b.addEventListener("click", () => b.closest("dialog").close()));
    let tAviso;
    function aviso(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.remove("subir", "fijo", "visible");
      void el.offsetWidth;
      el.classList.add("subir");
      clearTimeout(tAviso);
      tAviso = setTimeout(() => el.classList.remove("subir"), 1700);
    }
  </script>
</body>
</html>
