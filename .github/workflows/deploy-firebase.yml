name: Deploy Revelar to Firebase Hosting

# Publica la carpeta revelar/ en https://berean-revelar.web.app
# cada vez que se hace push a main (o a mano desde la pestaña Actions).
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (la llave JSON de la cuenta de servicio).
# Mientras no exista, este flujo se salta sin fallar.

on:
  push:
    branches: [main]
    paths:
      - "revelar/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAY_LLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Aviso si falta la llave
        if: env.HAY_LLAVE != 'true'
        run: echo "::notice::Falta el secreto FIREBASE_SERVICE_ACCOUNT; no se publica en Firebase."

      - name: Checkout
        if: env.HAY_LLAVE == 'true'
        uses: actions/checkout@v5

      - name: Deploy to Firebase Hosting
        if: env.HAY_LLAVE == 'true'
        env:
          LLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$LLAVE" > "$RUNNER_TEMP/llave.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/llave.json"
          set +e
          npx --yes firebase-tools@15 deploy --only hosting --project berean-revelar --non-interactive 2>&1 | tee "$RUNNER_TEMP/salida.txt"
          codigo=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/llave.json"
          if [ "$codigo" -ne 0 ]; then
            # Muestra el error como anotación (se ve en el resumen de la ejecución)
            grep -iE "error|denied|permission|not found|404|403|enable" "$RUNNER_TEMP/salida.txt" | tail -8 | while IFS= read -r l; do echo "::error::$l"; done
            exit "$codigo"
          fi

      # Reglas de seguridad de la base de datos (revelar/database.rules.json).
      # Necesita el rol "Firebase Realtime Database Admin" en la cuenta de servicio.
      # Si falla, no detiene la publicación de las páginas.
      - name: Deploy database rules
        if: env.HAY_LLAVE == 'true'
        continue-on-error: true
        env:
          LLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$LLAVE" > "$RUNNER_TEMP/llave.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/llave.json"
          set +e
          npx --yes firebase-tools@15 deploy --only database --project berean-revelar --non-interactive --debug > "$RUNNER_TEMP/reglas.txt" 2>&1
          codigo=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/llave.json"
          if [ "$codigo" -ne 0 ]; then
            grep -E "\[status\]|HTTP Error|PERMISSION|\"message\"" "$RUNNER_TEMP/reglas.txt" | grep -v " 200$" | tail -10 | while IFS= read -r l; do echo "::warning::Reglas: ${l:0:300}"; done
            exit "$codigo"
          fi
          echo "::notice::Reglas de la base de datos publicadas"
