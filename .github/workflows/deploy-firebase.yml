name: Deploy Revelar to Firebase Hosting

# Publica la carpeta revelar/ en https://berean-revelar.web.app
# cada vez que se hace push a main (o a mano desde la pestaña Actions).
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (la llave JSON de la cuenta de servicio).
# Mientras no exista, este flujo se salta sin fallar.

on:
  push:
    branches: [main]
    paths:
      - "revelar/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAY_LLAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Aviso si falta la llave
        if: env.HAY_LLAVE != 'true'
        run: echo "::notice::Falta el secreto FIREBASE_SERVICE_ACCOUNT; no se publica en Firebase."

      - name: Checkout
        if: env.HAY_LLAVE == 'true'
        uses: actions/checkout@v5

      - name: Deploy to Firebase Hosting
        if: env.HAY_LLAVE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: berean-revelar
          channelId: live
